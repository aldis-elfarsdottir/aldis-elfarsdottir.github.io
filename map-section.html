<!--
  Paste this whole <section> into index.html, wherever you want the map to
  appear (e.g. right after the Experience section, before Projects).
-->
<section id="map" class="section">
  <p class="eyebrow">Map</p>
  <h2>Where I've worked</h2>
  <p>Click a pin (or a place name below) to see the roles I held there.</p>

  <div id="world-map" class="world-map"></div>

  <div id="map-legend" class="map-legend"></div>

  <div id="map-detail" class="map-detail">
    <p class="map-placeholder">Select a location to see details.</p>
  </div>
</section>

<!--
  Add these three script tags just before your existing
  <script src="script.js"></script> line, at the very bottom of index.html.
  Order matters: d3 and topojson-client must load before map.js.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson-client/3.1.0/topojson-client.min.js"></script>
<script src="map-data.js"></script>
<script src="map.js"></script>
